name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: macos-latest
            os_name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck TypeScript runtime
        run: npm run typecheck

      - name: Fetch Zig dependencies
        run: zig build --fetch

      - name: Test Zig console
        run: zig build test

      - name: Package release archive
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          OS_NAME: ${{ matrix.os_name }}
        run: |
          case "$(uname -m)" in
            x86_64|amd64) ARCH_NAME="x64" ;;
            arm64|aarch64) ARCH_NAME="arm64" ;;
            *) ARCH_NAME="$(uname -m)" ;;
          esac
          TARGET_NAME="${OS_NAME}-${ARCH_NAME}" npm run release:package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexdev-cli-${{ matrix.os_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
